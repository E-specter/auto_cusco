[project]
name = "auto-cusco-backend"
version = "0.1.0"
description = "Backend de auto_cusco: ingesta de sabanas, seleccion, generacion de cargas y reportes de cobranza."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "python-calamine>=0.8.2",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI usa `Depends(...)` como valor por defecto de forma idiomatica
# (inyeccion de dependencias) -- no es el antipatron que la regla detecta.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: integracion contra el PostgreSQL de /.env; solo corre con AUTO_CUSCO_DB_TESTS=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
